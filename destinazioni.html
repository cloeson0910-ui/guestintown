<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guest in Town — Le nostre destinazioni</title>
<style>
  :root{
    --gold-1:#d9b05c;
    --gold-2:#f3d98b;
    --gold-3:#a9771f;
    --black:#000000;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{
    width:100%;
    background:var(--black);
    font-family:"Georgia","Times New Roman",serif;
    color:var(--gold-1);
  }
  body{
    min-height:100vh;
    position:relative;
    padding:min(10vh,90px) 6vw 90px;
    overflow-x:hidden;
  }

  .vignette{
    position:fixed; inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.7) 100%);
    z-index:0;
  }

  .brandmark{
    text-align:center;
    opacity:0;
    animation: fadeUp 1s ease-out .1s forwards;
  }
  .brandmark .word{
    font-size:14px; font-weight:600; letter-spacing:.42em; color:var(--gold-1);
    text-transform:uppercase;
  }
  .brandmark .tag{
    margin-top:6px; font-size:8px; font-weight:700; letter-spacing:.22em; color:#8a6f33;
    text-transform:uppercase;
  }

  .hero{
    position:relative; z-index:1;
    text-align:center;
    margin:min(8vh,64px) auto min(7vh,56px);
    max-width:900px;
  }
  .hero h1{
    font-size:clamp(28px, 4.4vw, 52px);
    font-weight:400;
    letter-spacing:.04em;
    line-height:1.25;
    color:var(--gold-2);
    opacity:0;
    transform:translateY(14px);
    animation: fadeUp 1.1s cubic-bezier(.22,.61,.36,1) .5s forwards;
    text-shadow:0 0 28px rgba(217,176,92,.25);
  }
  .hero .rule{
    width:120px; height:1px; margin:26px auto 0;
    background:linear-gradient(90deg, transparent, var(--gold-1), transparent);
    opacity:0;
    animation: fadeUp 1s ease-out 1.2s forwards;
  }

  @keyframes fadeUp{
    to{ opacity:1; transform:translateY(0); }
  }

  .grid{
    position:relative; z-index:1;
    max-width:1200px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:clamp(20px, 3vw, 40px);
  }
  @media (max-width: 860px){
    .grid{ grid-template-columns:1fr; max-width:460px; }
  }

  .dest-card{
    position:relative;
    display:block;
    text-decoration:none;
    border:1px solid rgba(217,176,92,.35);
    overflow:hidden;
    opacity:0;
    transform:translateY(22px);
    animation: fadeUp 1s cubic-bezier(.22,.61,.36,1) forwards;
    background:#060503;
    transition: border-color .5s ease, box-shadow .5s ease;
  }
  .dest-card:nth-child(1){ animation-delay:.8s; }
  .dest-card:nth-child(2){ animation-delay:1.0s; }
  .dest-card:nth-child(3){ animation-delay:1.2s; }

  .dest-card:hover{
    border-color:var(--gold-2);
    box-shadow:0 0 26px rgba(217,176,92,.35);
  }

  .dest-img-wrap{
    position:relative;
    width:100%;
    aspect-ratio: 4 / 3.1;
    overflow:hidden;
  }
  .dest-img-wrap img{
    width:100%; height:100%; object-fit:cover; display:block;
    filter:saturate(.92) brightness(.88);
    transform:scale(1.04);
    transition: transform 1.1s cubic-bezier(.22,.61,.36,1), filter .7s ease;
  }
  .dest-card:hover .dest-img-wrap img{
    transform:scale(1.14);
    filter:saturate(1.05) brightness(1);
  }

  .dest-img-wrap::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.85) 100%);
    pointer-events:none;
  }

  .dest-label{
    position:relative;
    padding:18px 16px 20px;
    text-align:center;
    transition: background-color .45s ease, color .45s ease;
  }
  .dest-label span{
    display:block;
    font-size:13px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--gold-2);
    transition:color .45s ease;
  }
  .dest-label small{
    display:block;
    margin-top:6px;
    font-size:9px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:#8a6f33;
    transition:color .45s ease;
  }
  .dest-card:hover .dest-label{
    background:var(--gold-1);
  }
  .dest-card:hover .dest-label span{ color:#000; }
  .dest-card:hover .dest-label small{ color:#2a1f0c; }

  .footer-note{
    position:relative; z-index:1;
    text-align:center;
    margin-top:min(9vh,70px);
    font-size:10px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:#6b5527;
    opacity:0;
    animation: fadeUp 1s ease-out 1.6s forwards;
  }
</style>
</head>
