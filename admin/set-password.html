<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imposta password – Guest in Town</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;}
.box{background:#1b1b1b;border:1px solid #2a2a2a;border-radius:12px;padding:32px;width:100%;max-width:400px;}
h1{margin:0 0 6px;font-size:22px;color:#c9a96e;}
p{color:#aaa;font-size:14px;margin:0 0 22px;line-height:1.5;}
label{display:block;font-size:13px;color:#ccc;margin:0 0 8px;}
input{width:100%;padding:12px;border:none;border-radius:6px;box-sizing:border-box;margin-bottom:16px;font-size:15px;}
button{width:100%;background:#c9a96e;color:#000;font-weight:bold;padding:13px;border:none;border-radius:6px;cursor:pointer;font-size:15px;}
button:disabled{opacity:.5;}
.msg{margin-top:14px;font-size:14px;min-height:18px;}
.err{color:#e74c3c}.ok{color:#2ecc71}
</style>
</head>
<body>
<div class="box">
<h1>Guest in Town</h1>
<p id="intro">Scegli la password del tuo account.</p>
<form id="f">
<label>Nuova password (minimo 8 caratteri)</label>
<input type="password" id="p1" minlength="8" required autocomplete="new-password">
<label>Ripeti la password</label>
<input type="password" id="p2" minlength="8" required autocomplete="new-password">
<button id="b">Salva password</button>
</form>
<div class="msg" id="m"></div>
</div>
<script>
const m=document.getElementById('m'),b=document.getElementById('b');
const show=(t,c)=>{m.textContent=t;m.className='msg '+c;};
/* il link dell'email porta qui con la sessione nell'URL: supabase-js la legge da solo */
(async()=>{
  await new Promise(r=>setTimeout(r,600));
  const {data}=await supabaseClient.auth.getSession();
  if(!data.session){
    const err=new URLSearchParams(location.hash.slice(1)).get('error_description');
    show(err?('Link non valido o scaduto: '+err):'Link non valido o scaduto. Chiedi un nuovo invito.','err');b.disabled=true;
  }else{document.getElementById('intro').textContent='Account: '+data.session.user.email+'. Scegli la tua password.';}
})();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;
  if(p1.length<8)return show('La password deve avere almeno 8 caratteri.','err');
  if(p1!==p2)return show('Le due password non coincidono.','err');
  b.disabled=true;
  const {error}=await supabaseClient.auth.updateUser({password:p1});
  if(error){b.disabled=false;return show(error.message,'err');}
  show('Password salvata. Ti porto alla dashboard...','ok');
  setTimeout(()=>location.href='dashboard.html',1500);
});
</script>
</body>
</html>
