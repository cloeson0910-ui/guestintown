<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guest in Town</title>
<style>
  :root{
    --gold-1:#d9b05c;
    --gold-2:#f3d98b;
    --gold-3:#a9771f;
    --black:#000000;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{
    width:100%; height:100%;
    background:#070503;
    overflow:hidden;
    font-family:"Georgia","Times New Roman",serif;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
    position:relative;
  }

  /* ===== fascio di luce =====
     1s di nero, poi la luce nasce piccola al centro, cresce in modo
     lineare e continuo per ~2s, e infine implode (collassa verso il
     centro mentre svanisce) lasciando il logo a fuoco. Sfocata, nessun
     bordo netto. */
  .beam{
    position:absolute;
    top:50%; left:50%;
    width:140vmax; height:140vmax;
    transform:translate(-50%,-50%) scale(0.02);
    border-radius:50%;
    background:radial-gradient(circle,
      rgba(255,255,255,0.9) 0%,
      rgba(243,217,139,0.45) 16%,
      rgba(217,176,92,0.16) 34%,
      rgba(217,176,92,0.04) 52%,
      rgba(0,0,0,0) 72%);
    filter:blur(48px);
    opacity:0;
    animation: beamImplode 3.2s linear 1s forwards;
  }
  @keyframes beamImplode{
    0%   { transform:translate(-50%,-50%) scale(0.02); opacity:0; }
    8%   { transform:translate(-50%,-50%) scale(0.1);  opacity:.9; }
    62%  { transform:translate(-50%,-50%) scale(1);    opacity:1; }
    100% { transform:translate(-50%,-50%) scale(0.03); opacity:0; }
  }

  /* ===== wrapper logo ===== */
  .stage{
    position:relative;
    width:min(46vw, 380px);
    display:flex; flex-direction:column; align-items:center;
    z-index:2;
  }

  .logo-wrap{
    position:relative;
    width:100%;
    opacity:0;
    animation: logoReveal 1.3s cubic-bezier(.22,.61,.36,1) 2.9s forwards;
  }
  @keyframes logoReveal{
    to{ opacity:1; }
  }

  .logo-wrap img{
    width:100%;
    display:block;
    /* l'immagine è già un rilievo 3D calcolato pixel per pixel (tubo
       arrotondato con luce direzionale e specular), qui resta solo
       un'ombra di contatto e un filo di riflesso a terra */
    filter: drop-shadow(0 3px 5px rgba(0,0,0,.35));
  }

  /* ===== pulsante VISITA ===== */
  .enter-btn{
    margin-top:clamp(28px, 5vh, 52px);
    opacity:0;
    transform:translateY(10px);

    position:relative;
    padding:14px 46px;
    font-family:"Georgia","Times New Roman",serif;
    font-size:13px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:#E8CA2C;
    background:transparent;
    border:1px solid #E8CA2C;
    border-radius:2px;
    cursor:pointer;
    overflow:hidden;
    text-decoration:none;
    display:inline-block;
    text-align:center;

    animation-name: btnIn, pulseGlow;
    animation-duration: 1.1s, 2.4s;
    animation-delay: 4.9s, 6s;
    animation-timing-function: cubic-bezier(.22,.61,.36,1), ease-in-out;
    animation-iteration-count: 1, infinite;
    animation-fill-mode: forwards, none;
  }
  @keyframes btnIn{
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 0 0px rgba(217,176,92,0), inset 0 0 0px rgba(217,176,92,0); border-color:var(--gold-1); }
    50%    { box-shadow:0 0 16px rgba(217,176,92,.55), inset 0 0 10px rgba(217,176,92,.12); border-color:var(--gold-2); }
  }

  .enter-btn span{
    position:relative;
    z-index:2;
    transition:color .45s ease;
  }
  .enter-btn::before{
    content:"";
    position:absolute;
    inset:0;
    background:var(--gold-1);
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .45s cubic-bezier(.4,0,.2,1);
    z-index:1;
  }
  .enter-btn:hover{
    animation-play-state: paused, paused;
  }
  .enter-btn:hover::before{
    transform:scaleX(1);
  }
  .enter-btn:hover span{
    color:#000;
  }
  .enter-btn:hover{
    box-shadow:0 0 22px rgba(217,176,92,.65);
  }

  /* leggerissimo rumore/texture per non apparire piatto */
  .vignette{
    position:absolute; inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 70%, rgba(0,0,0,.35) 100%);
    z-index:3;
  }

  /* ===== oro specchio ===== */
  .logo-art{ position:relative; }
  .logo-art img{ width:100%; display:block; }
  .sheen{ display:none;

    position:absolute; inset:0;
    pointer-events:none;
    -webkit-mask-size:100% 100%; mask-size:100% 100%;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    /* oro lucido, senza bianchi */
    background:linear-gradient(180deg,
        #c8952c 0%,  #f2c94c 8%,  #ffe08a 14%, #e3ad36 22%, #b88320 30%,
        #e6b43c 38%, #ffdc7a 46%, #f0c24a 54%, #bf8a24 62%, #e0aa35 70%,
        #ffd96f 78%, #eab843 86%, #c08b25 93%, #d9a332 100%);
  }
  /* ombreggiatura sul logo */
  .logo-wrap > .logo-art{
    z-index:1;
    filter:
      drop-shadow(0.6px 0.6px 0 #8a5e18)
      url(#extrude)
      drop-shadow(0 6px 8px rgba(0,0,0,.85));
  }

  /* specchiatura = fine dell'estrusione (filtro #extrude: 2,5mm a destra, 2mm in basso) */

  /* ===== profondità: gradiente al centro della scena, il logo fluttua ===== */
  html,body{
    background:radial-gradient(ellipse 55% 60% at 50% 45%, #3a3a3a 0%, #262626 25%, #141414 50%, #060606 75%, #000000 100%) #000000;
  }

  /* oro specchio anche sulla scritta VISITA */
  .enter-btn span{
    background:linear-gradient(180deg, #FCF9B5 0%, #E8CA2C 55%, #FCF9B5 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .enter-btn:hover span{ -webkit-text-fill-color:#000; }
</style>
</head>
