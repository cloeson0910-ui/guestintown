<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guest in Town</title>
<style>
  :root{
    --gold-1:#d9b05c;
    --gold-2:#f3d98b;
    --gold-3:#a9771f;
    --black:#000000;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{
    width:100%; height:100%;
    background:radial-gradient(ellipse 55% 60% at 50% 45%, #2e2e2e 0%, #1c1c1c 28%, #0c0c0c 55%, #000000 100%) var(--black);
    overflow:hidden;
    font-family:"Georgia","Times New Roman",serif;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
    position:relative;
  }

  /* ===== fascio di luce =====
     1s di nero, poi la luce nasce piccola al centro, cresce in modo
     lineare e continuo per ~2s, e infine implode (collassa verso il
     centro mentre svanisce) lasciando il logo a fuoco. Sfocata, nessun
     bordo netto. */
  .beam{
    position:absolute;
    top:50%; left:50%;
    width:140vmax; height:140vmax;
    transform:translate(-50%,-50%) scale(0.02);
    border-radius:50%;
    background:radial-gradient(circle,
      rgba(255,255,255,0.9) 0%,
      rgba(243,217,139,0.45) 16%,
      rgba(217,176,92,0.16) 34%,
      rgba(217,176,92,0.04) 52%,
      rgba(0,0,0,0) 72%);
    filter:blur(48px);
    opacity:0;
    animation: beamImplode 3.2s linear 1s forwards;
  }
  @keyframes beamImplode{
    0%   { transform:translate(-50%,-50%) scale(0.02); opacity:0; }
    8%   { transform:translate(-50%,-50%) scale(0.1);  opacity:.9; }
    62%  { transform:translate(-50%,-50%) scale(1);    opacity:1; }
    100% { transform:translate(-50%,-50%) scale(0.03); opacity:0; }
  }

  /* ===== wrapper logo ===== */
  .stage{
    position:relative;
    width:min(46vw, 380px);
    display:flex; flex-direction:column; align-items:center;
    z-index:2;
  }

  .logo-wrap{
    position:relative;
    width:100%;
    opacity:0;
    animation: logoReveal 1.3s cubic-bezier(.22,.61,.36,1) 2.9s forwards;
  }
  @keyframes logoReveal{
    to{ opacity:1; }
  }

  .logo-wrap img{
    width:100%;
    display:block;
    filter:url(#extrude) drop-shadow(1.5px 2px 0.8px rgba(0,0,0,.8));
  }
  /* solido: il logo è unito alla specchiatura (1,5mm in basso, 1,5mm a destra) con un gradiente */

  /* ===== pulsante VISITA ===== */
  .enter-btn{
    margin-top:clamp(28px, 5vh, 52px);
    opacity:0;
    transform:translateY(10px);

    position:relative;
    padding:14px 46px;
    font-family:"Georgia","Times New Roman",serif;
    font-size:13px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--gold-2);
    background:transparent;
    border:1px solid var(--gold-1);
    border-radius:2px;
    cursor:pointer;
    overflow:hidden;
    text-decoration:none;
    display:inline-block;
    text-align:center;

    animation-name: btnIn, pulseGlow;
    animation-duration: 1.1s, 2.4s;
    animation-delay: 4.9s, 6s;
    animation-timing-function: cubic-bezier(.22,.61,.36,1), ease-in-out;
    animation-iteration-count: 1, infinite;
    animation-fill-mode: forwards, none;
  }
  @keyframes btnIn{
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 0 0px rgba(217,176,92,0), inset 0 0 0px rgba(217,176,92,0); border-color:var(--gold-1); }
    50%    { box-shadow:0 0 16px rgba(217,176,92,.55), inset 0 0 10px rgba(217,176,92,.12); border-color:var(--gold-2); }
  }

  .enter-btn span{
    position:relative;
    z-index:2;
    transition:color .45s ease;
  }
  .enter-btn::before{
    content:"";
    position:absolute;
    inset:0;
    background:var(--gold-1);
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .45s cubic-bezier(.4,0,.2,1);
    z-index:1;
  }
  .enter-btn:hover{
    animation-play-state: paused, paused;
  }
  .enter-btn:hover::before{
    transform:scaleX(1);
  }
  .enter-btn:hover span{
    color:#000;
  }
  .enter-btn:hover{
    box-shadow:0 0 22px rgba(217,176,92,.65);
  }

  /* leggerissimo rumore/texture per non apparire piatto */
  .vignette{
    position:absolute; inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.65) 100%);
    z-index:3;
  }
</style>
</head>
