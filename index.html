  :root{
    --gold-1:#c9ad82;
    --gold-2:#f7e9cf;
    --gold-3:#a8875d;
    --black:#000000;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{
    width:100%; height:100%;
    background:radial-gradient(ellipse 55% 60% at 50% 45%, #2e2e2e 0%, #1c1c1c 28%, #0c0c0c 55%, #000000 100%) var(--black);
    overflow:hidden;
    font-family:"Georgia","Times New Roman",serif;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
    position:relative;
  }

  /* ===== fascio di luce =====
     1s di nero, poi la luce nasce piccola al centro, cresce in modo
     lineare e continuo per ~2s, e infine implode (collassa verso il
     centro mentre svanisce) lasciando il logo a fuoco. Sfocata, nessun
     bordo netto. */
  .beam{
    position:absolute;
    top:50%; left:50%;
    width:140vmax; height:140vmax;
    transform:translate(-50%,-50%) scale(0.02);
    border-radius:50%;
    background:radial-gradient(circle,
      rgba(255,255,255,0.9) 0%,
      rgba(247,233,207,0.45) 16%,
      rgba(201,173,130,0.16) 34%,
      rgba(201,173,130,0.04) 52%,
      rgba(0,0,0,0) 72%);
    filter:blur(48px);
    opacity:0;
    animation: beamImplode 3.2s linear 1s forwards;
  }
  @keyframes beamImplode{
    0%   { transform:translate(-50%,-50%) scale(0.02); opacity:0; }
    8%   { transform:translate(-50%,-50%) scale(0.1);  opacity:.9; }
    55%  { transform:translate(-50%,-50%) scale(1);    opacity:1; }
    100% { transform:translate(-50%,-50%) scale(2.4);  opacity:0; }
  }

  /* ===== wrapper logo ===== */
  .stage{
    position:relative;
    width:min(84vw, 760px, calc((100svh - 230px) / 1.03));
    display:flex; flex-direction:column; align-items:center;
    z-index:2;
  }

  .logo-wrap{
    position:relative;
    width:100%;
    opacity:0;
    animation: logoReveal 0.01s linear 2.6s forwards;
  }
  @keyframes logoReveal{ to{ opacity:1; } }

  .logo-wrap img{
    width:100%;
    display:block;
    filter:none;
  }
  /* solido: il logo è unito alla specchiatura (1,5mm in basso, 1,5mm a destra) con un gradiente */

  /* ===== pulsante VISITA ===== */
  .enter-btn{
    margin-top:clamp(22px, 4vh, 44px);
    opacity:0;
    transform:translateY(10px);
    box-shadow:1px 1px 0 #b39468, 2px 2px 0 #a3855b, 3px 3px 0 #93774f, 4px 4px 0 #846a45, 5px 5px 0 #745d3b, 6px 6px 0 #654f31, inset 1px 1px 0 rgba(247,233,207,.9), inset -1px -1px 0 rgba(94,74,46,.9), 0 0 0px rgba(201,173,130,0);

    position:relative;
    padding:16px 58px;
    font-family:"Cinzel","Georgia",serif;
    font-weight:600;
    font-size:16px;
    letter-spacing:.34em;

    text-transform:uppercase;
    color:var(--gold-2);
    background:transparent;
    border:2px solid transparent;border-image:linear-gradient(135deg,#f7e9cf,#c9ad82 45%,#7d6440) 1;
    border-radius:2px;
    cursor:pointer;
    overflow:hidden;
    text-decoration:none;
    display:inline-block;
    text-align:center;

    animation-name: btnIn, pulseGlow;
    animation-duration: 1.1s, 2.4s;
    animation-delay: 6.3s, 7.4s;
    animation-timing-function: cubic-bezier(.22,.61,.36,1), ease-in-out;
    animation-iteration-count: 1, infinite;
    animation-fill-mode: forwards, none;
  }
  @keyframes btnIn{
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:1px 1px 0 #b39468, 2px 2px 0 #a3855b, 3px 3px 0 #93774f, 4px 4px 0 #846a45, 5px 5px 0 #745d3b, 6px 6px 0 #654f31, inset 1px 1px 0 rgba(247,233,207,.9), inset -1px -1px 0 rgba(94,74,46,.9), 0 0 0px rgba(201,173,130,0); border-color:var(--gold-1); }
    50%    { box-shadow:1px 1px 0 #b39468, 2px 2px 0 #a3855b, 3px 3px 0 #93774f, 4px 4px 0 #846a45, 5px 5px 0 #745d3b, 6px 6px 0 #654f31, inset 1px 1px 0 rgba(247,233,207,.9), inset -1px -1px 0 rgba(94,74,46,.9), 0 0 18px rgba(201,173,130,.55); border-color:var(--gold-2); }
  }

  .enter-btn span{
    background:linear-gradient(180deg,#f7e9cf 0%,#d9c39a 50%,#a8875d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(1px 1px 0 #93774f) drop-shadow(1px 1px 0 #6f5838);
    position:relative;
    z-index:2;
    transition:color .45s ease;
  }
  .enter-btn::before{
    content:"";
    position:absolute;
    inset:0;
    background:var(--gold-1);
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .45s cubic-bezier(.4,0,.2,1);
    z-index:1;
  }
  .enter-btn:hover{
    animation-play-state: paused, paused;
  }
  .enter-btn:hover::before{
    transform:scaleX(1);
  }
  .enter-btn:hover span{
    background:none;-webkit-background-clip:border-box;color:#000;
  }
  .enter-btn:hover{
    box-shadow:1px 1px 0 #b39468, 2px 2px 0 #a3855b, 3px 3px 0 #93774f, 4px 4px 0 #846a45, 5px 5px 0 #745d3b, 6px 6px 0 #654f31, inset 1px 1px 0 rgba(247,233,207,.9), inset -1px -1px 0 rgba(94,74,46,.9), 0 0 22px rgba(201,173,130,.65);
  }

  /* leggerissimo rumore/texture per non apparire piatto */
  .vignette{
    position:absolute; inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.65) 100%);
    z-index:3;
  }

  /* ===== bagliore che attraversa il logo (dopo la comparsa di VISITA) ===== */
